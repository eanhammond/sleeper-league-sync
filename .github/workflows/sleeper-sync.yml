name: Save Sleeper league snapshot
run-name: Sleeper sync (${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || github.event_name }})

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Who requested this sync?'
        type: string
        required: false
        default: 'manual'
  schedule:
    # Two daily attempts, at 7:17 AM and 6:17 PM Eastern.
    # GitHub may start scheduled jobs late or occasionally skip them.
    - cron: '17 7,18 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: sleeper-sync
  cancel-in-progress: false

jobs:
  sync:
    # Privacy guard: a PUBLIC repository must not produce league snapshots.
    # This workflow works only after someone creates a PRIVATE repository
    # using the public template.
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Sleeper league data
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SLEEPER_USER_ID: ${{ secrets.SLEEPER_USER_ID }}
          REPORT_TIMEZONE: America/New_York
        run: python scripts/sync_sleeper.py

      - name: Save snapshot to the private repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes to save.'
            exit 0
          fi
          git commit -m 'chore: update Sleeper snapshot [skip ci]'
          for attempt in 1 2 3; do
            if git push; then
              echo "Snapshot saved (attempt $attempt)."
              exit 0
            fi
            echo 'Branch moved while collecting; rebasing and retrying.'
            git pull --rebase origin main || exit 1
            sleep 5
          done
          echo 'Unable to save snapshot after three attempts.' >&2
          exit 1
